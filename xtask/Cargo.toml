[package]
name = "xtask"
version = "0.15.4"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# The capability table is rendered into the docs from the real data
# (`cargo xtask sync-capabilities`), so the page cannot drift from the code.
xa11y-core = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
serde_json = { workspace = true }
# `full` is required to parse whole source files (items, impl blocks, fn
# signatures) rather than just proc-macro token streams.
syn = { version = "3", features = ["full"] }
# Used with syn to read the *code* of a source file: the Rust lexer drops
# comments and collapses string literals into single tokens, so the variant
# scan needs no comment/quote handling of its own.
quote = "1"
# `span-locations` gives the check-windows-dpi lint line numbers.
proc-macro2 = { version = "1", features = ["span-locations"] }
