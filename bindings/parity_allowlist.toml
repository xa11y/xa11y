    { method = "App::foreground_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::list_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::find_with", reason = "Binding uses the singleton provider; exposed to JS as `App.find`, a poll loop in index.js." },
    { method = "App::try_find_with", reason = "Fallible-predicate variant of find_with; the JS App.find poll loop propagates predicate errors directly." },
    { method = "App::provider", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "App::data", reason = "Internal plumbing for provider implementors, not user API." },

    { method = "Locator::new", reason = "Internal Rust constructor; bindings build Locators via App.locator() / module-level locator()." },
    { method = "Element::new", reason = "Internal Rust constructor; bindings obtain Elements via Locator / navigation." },
    { method = "Element::for_role", reason = "Flattened from ElementData: the provider-side constructor for a bare ElementData. Bindings receive elements from the provider and never build one." },
    { method = "Event::new", reason = "Provider-side constructor for an Event. Bindings receive events from a Subscription and never build one." },
    { method = "Screenshot::new", reason = "Backend-side constructor for a capture. Bindings receive Screenshots from the capture entry points and never build one." },
