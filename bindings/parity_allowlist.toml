    { method = "InputSim::click_with", reason = "Folded into `click(target, options)`'s options object (button, count, held, anchor); `click()` calls Mouse::click_with unconditionally." },
    { method = "InputSim::drag_with", reason = "Folded into `drag(start, end, options)`'s options object (button, held, duration); `drag()` calls Mouse::drag_with unconditionally." },
