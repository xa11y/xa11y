# Contract between xa11y-core's public API and its language bindings.
#
# Enforced by `cargo xtask check-bindings-parity`, which reads core's real
# public surface from rustdoc JSON. Two rules:
#
#   1. Every public type in xa11y-core must be classified under [types].
#      A new public type that nobody classified fails the check — that is
#      the point. You cannot add public API and forget the bindings.
#   2. For `mirrored` types, every public member must exist in both
#      bindings, and every binding member must map to a core member,
#      unless listed below with a reason.
#   3. For `[[types.variant_coverage]]` enums, every variant must be named
#      in each listed file. These enums are `#[non_exhaustive]`, so the
#      compiler no longer fails a binding that forgets one.
#
# `#[doc(hidden)]` items are not public API and never need an entry.
#
# This file records whether a member is *present* in each binding. What shape
# it takes there — options folded into the primary verb, enum values as
# snake_case strings, seconds in Python vs milliseconds in JS — is governed by
# "Binding Shape Conventions" in AGENTS.md. Several reasons below are only
# true because of those conventions; read them together.

# ── Type classification ──────────────────────────────────────────────────

[types]
# Bindings expose this type and each of its members.
mirrored = [
    "App",
    "Element",
    "Event",
    "InputSim",
    "Locator",
    "Screenshot",
    "Subscription",
]

# Crosses the language boundary, but not as a class with mirrored members —
# it becomes a primitive, a plain object, or a set of exception classes.
opaque = [
    { type = "Role", reason = "Roles cross the boundary as strings (`button`, `text_field`); the enum's variants are not mirrored as binding members." },
    { type = "Error", reason = "Mapped to a hierarchy of native exception classes (XA11yError, TimeoutError, ...) rather than a single mirrored type." },
    { type = "Diagnosis", reason = "Surfaced as structured attributes on the raised exception (selector, condition, candidates, ...), not as its own class." },
    { type = "EventKind", reason = "Exposed as string constants (Python `EventType.FOCUS_CHANGED`, JS `EventTypeName` union) rather than a mirrored enum." },
    { type = "StateFlag", reason = "Exposed as the string `state_flag` attribute on Event." },
    { type = "Toggled", reason = "Exposed as the string union 'on' | 'off' | 'mixed'." },
    { type = "Key", reason = "Keys cross the boundary as strings (`enter`, `ctrl+a`); the enum is a parsing detail." },
    { type = "MouseButton", reason = "Exposed as the strings 'left' | 'right' | 'middle'." },
    { type = "Anchor", reason = "Exposed as the strings 'center' | 'top_left' | 'top_right' | 'bottom_left' | 'bottom_right', or an (dx, dy) / [dx, dy] offset pair for Anchor::Offset." },
    { type = "Rect", reason = "Python exposes a Rect class; JS returns a plain object literal typed in index.d.ts. Members are not mirrored uniformly, so they are covered by the per-binding type tests instead." },
    { type = "TreeNode", reason = "`tree()` returns nested plain data (dicts / objects), not a mirrored node class." },
]

# Not part of the binding surface at all.
internal = [
    # ── Provider-facing traits: implemented by backends, not called by users ──
    { type = "Provider", reason = "Implemented by platform backends; not user API." },
    { type = "InputProvider", reason = "Implemented by platform backends; not user API." },
    { type = "ScreenshotProvider", reason = "Implemented by platform backends; not user API." },
    { type = "IntoPoint", reason = "Rust ergonomics trait for accepting (x, y) tuples or Points; bindings take plain numbers." },

    # ── Selector engine internals: bindings accept selector strings ──
    { type = "Selector", reason = "Bindings pass selector strings; the parsed representation stays in Rust." },
    { type = "SelectorGroup", reason = "Parsed selector representation; bindings pass strings." },
    { type = "SelectorSegment", reason = "Parsed selector representation; bindings pass strings." },
    { type = "SimpleSelector", reason = "Parsed selector representation; bindings pass strings." },
    { type = "AttrFilter", reason = "Parsed selector representation; bindings pass strings." },
    { type = "Combinator", reason = "Parsed selector representation; bindings pass strings." },
    { type = "MatchOp", reason = "Parsed selector representation; bindings pass strings." },
    { type = "RoleMatch", reason = "Parsed selector representation; bindings pass strings." },

    # ── Flattened into another type (see [[types.flatten]] below) ──
    { type = "ElementData", reason = "Element derefs to ElementData; its fields are mirrored as getters on Element. See [[types.flatten]]." },
    { type = "StateSet", reason = "Flattened into Element as individual boolean getters. See [[types.flatten]]." },
    { type = "Keyboard", reason = "Flattened into InputSim in both bindings. See [[types.flatten]]." },
    { type = "Mouse", reason = "Flattened into InputSim in both bindings. See [[types.flatten]]." },

    # ── Event / subscription plumbing ──
    { type = "EventReceiver", reason = "Internal channel wrapper; bindings expose Subscription's recv/iter idioms instead." },
    { type = "CancelHandle", reason = "Internal cancellation token; bindings expose Subscription.close()." },
    { type = "SubscriptionIter", reason = "Rust blocking iterator; bindings use __iter__ (Python) and EventEmitter (JS)." },
    { type = "RecvStatus", reason = "Rust disconnected-vs-timeout discriminator; bindings raise exceptions instead." },
    { type = "ElementState", reason = "Rust state enum for the generic wait_for_state; bindings expose specific wait_* methods." },

    # ── Input geometry / option structs: bindings take plain params ──
    { type = "Point", reason = "Bindings take plain x/y numbers." },
    { type = "ScrollDelta", reason = "Bindings take plain dx/dy numbers." },
    { type = "ClickOptions", reason = "Options struct for Mouse::click_with; its fields are the optional params of the bindings' click() (Python keywords, JS options object)." },
    { type = "DragOptions", reason = "Options struct for Mouse::drag_with; its fields are the optional params of the bindings' drag() (Python keywords, JS options object)." },
    { type = "ClickTarget", reason = "Internal click-target discriminator for the input backends." },
]

# ── Variant coverage ─────────────────────────────────────────────────────
#
# `Error`, `EventKind`, and `StateFlag` are `#[non_exhaustive]` in core, and
# each crosses the boundary through a hand-written per-variant mapping rather
# than a mechanical conversion. (`Role` and `Key` are not here: they convert
# via `to_snake_case` / a parser, so a new variant needs no binding edit.)
#
# Before `#[non_exhaustive]`, the bindings' exhaustive `match` was what forced
# a new variant to be mapped — adding one to core failed their build. The `_`
# arm those matches now carry for forward compatibility would swallow it
# silently. These entries are the replacement guard: every variant of `type`
# must appear as `Type::Variant` in each listed file.
#
# Adding a variant to one of these enums therefore means editing every file
# below, which is the same work the compiler used to demand.
# A file entry is either a bare path (the variant is written as
# `Type::Variant` in Rust code) or a table naming how that file spells it:
# `spelling = "snake" | "camel" | "screaming_snake"`, plus an optional
# `prefix`. Generated stubs and JS lookup tables carry the variant as a
# string, and they are just as much a place a new variant must be handled.
# How the scan reads each file. Rust files are parsed with `syn` and scanned
# as tokens, so comments and string literals are not present at all and
# nothing has to be stripped: a mention only counts if it is real code.
# Imports and `#[cfg(test)]` items are dropped, because importing a variant or
# naming it in a test is not mapping it.
#
# The `.pyi` / `.mjs` / `.js` files have no parser available, so those get a
# line-comment strip and a quoted-token match. That is deliberately simple —
# whatever it gets wrong stays on one line — and `within` scopes the search
# when one file carries several enums' spellings.

[[types.variant_coverage]]
type = "Error"
reason = "Each variant maps to a specific exception class / error code; an unmapped one would fall through to the generic XA11yError."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/errors.rs",
    # index.js maps each code tag to a JS error class; an unlisted tag falls
    # through `if (!Cls) return err` and reaches the user as an untyped Error.
    { path = "xa11y-js/index.js", spelling = "screaming_snake", prefix = "XA11Y_" },
]

[[types.variant_coverage]]
type = "EventKind"
reason = "Each variant maps to a distinct event-type string in both bindings and in the CLI's `xa11y watch` output; an unmapped one would print as 'unknown'."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/types.rs",
    "xa11y/src/cli.rs",
    # The user-facing spellings: Python's EventType constants and the JS
    # EventTypeName union. Both are hand-maintained alongside the Rust arms.
    { path = "xa11y-python/python/xa11y/_native.pyi", spelling = "snake" },
    { path = "xa11y-js/scripts/patch-native-dts.mjs", spelling = "camel", within = "EventTypeName" },
]

# The value enums below cross as snake_case strings through hand-written
# parsers with a catch-all `_` arm, so neither the compiler nor the type
# classification catches a variant the bindings can't name. `MouseButton` and
# `Toggled` are exhaustive in core (the backends must map them), but that says
# nothing about the *binding* side, which is what these entries cover.
[[types.variant_coverage]]
type = "Anchor"
reason = "Crosses as a snake_case string through parse_anchor in both bindings; an unnamed anchor is rejected at runtime by a library whose type system offers it."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/input.rs",
    # `Anchor::Offset` carries a (dx, dy) payload rather than a name, so the
    # TypeScript union has nothing to list for it.
    { path = "xa11y-js/scripts/patch-native-dts.mjs", spelling = "snake", within = "AnchorName", exclude = ["Offset"] },
]

[[types.variant_coverage]]
type = "MouseButton"
reason = "Crosses as a snake_case string through parse_button in both bindings, and as the MouseButtonName union in TypeScript."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/input.rs",
    { path = "xa11y-js/scripts/patch-native-dts.mjs", spelling = "snake", within = "MouseButtonName" },
]

[[types.variant_coverage]]
type = "Toggled"
reason = "Crosses as the string union 'on' | 'off' | 'mixed'; the TypeScript CheckedState alias is hand-maintained alongside the Rust arms."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/types.rs",
    { path = "xa11y-js/scripts/patch-native-dts.mjs", spelling = "snake", within = "CheckedState" },
]

[[types.variant_coverage]]
type = "StateFlag"
reason = "Each variant maps to a distinct state-name string in both bindings; an unmapped one would surface as 'unknown'."
files = [
    "xa11y-python/src/lib.rs",
    "xa11y-js/src/types.rs",
]

# Types with no binding class of their own, whose members surface on another
# type. Members listed here are REQUIRED on the target binding type — this
# replaces what used to be dozens of per-member allowlist entries.
[[types.flatten]]
into = "Element"
from = ["ElementData", "StateSet"]
reason = "Element derefs to ElementData, and both bindings expose StateSet's booleans as getters directly on Element (element.enabled, element.visible, ...)."

[[types.flatten]]
into = "InputSim"
from = ["Keyboard", "Mouse"]
reason = "Both bindings flatten the keyboard and mouse sub-APIs onto InputSim (input_sim().click(), input_sim().type_text(), ...) instead of exposing sub-objects."
# Flattening merges by name, so `Keyboard::down` and `Mouse::down` would
# collapse into a single required `down` — quietly excusing the bindings from
# exposing one of the two. The device prefix disambiguates them; the checker
# fails on any undeclared collision.
rename = [
    { member = "Keyboard::down", to = "key_down" },
    { member = "Keyboard::up", to = "key_up" },
    { member = "Mouse::down", to = "mouse_down" },
    { member = "Mouse::up", to = "mouse_up" },
]

# ── Python ───────────────────────────────────────────────────────────────

[python]
# Core members deliberately not exposed to Python. key = "Type::member".
rust_only = [
    # App: explicit-provider plumbing. The binding uses the global singleton
    # provider; `_with` variants exist for injection in Rust tests.
    { method = "App::by_name_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::by_pid_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::foreground_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::list_with", reason = "Binding uses the singleton provider; `_with` variants are Rust-only plumbing for explicit provider injection." },
    { method = "App::find_with", reason = "Binding uses the singleton provider; exposed to Python as `App.find`." },
    { method = "App::try_find_with", reason = "Fallible-predicate variant of find_with; `App.find` routes through it and re-raises predicate errors." },
    { method = "App::provider", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "App::data", reason = "Internal plumbing for provider implementors, not user API." },

    # Internal Rust constructors / accessors.
    { method = "Locator::new", reason = "Internal Rust constructor; bindings build Locators via App.locator() / module-level locator()." },
    { method = "Element::new", reason = "Internal Rust constructor; bindings obtain Elements via Locator / navigation." },
    { method = "Element::for_role", reason = "Flattened from ElementData: the provider-side constructor for a bare ElementData. Bindings receive elements from the provider and never build one." },
    { method = "Event::new", reason = "Provider-side constructor for an Event. Bindings receive events from a Subscription and never build one." },
    { method = "Screenshot::new", reason = "Backend-side constructor for a capture. Bindings receive Screenshots from the capture entry points and never build one." },
    { method = "Element::data", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "Element::provider", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "Element::handle", reason = "Opaque provider handle; not part of the user-visible API." },
    { method = "Element::states", reason = "Python flattens StateSet into individual getters (enabled, visible, ...) rather than exposing the nested struct. The individual booleans ARE required — see [[types.flatten]]." },
    { method = "Subscription::new", reason = "Internal Rust constructor; bindings create Subscriptions via App.subscribe() / Element.subscribe()." },
    { method = "InputSim::new", reason = "Internal Rust constructor; bindings obtain an InputSim via the module-level input_sim()." },

    # Event field naming / representation.
    #
    # `kind` surfaces as `event_type` in Python and `type` in JS. The split is
    # deliberate, not drift: each binding uses the name that reads naturally in
    # its own language, exactly as the rest of the flattened EventKind payload
    # does (`state_flag` / `stateFlag`). `type` shadows a Python builtin at
    # every call site that destructures it, and `eventType` is redundant in JS
    # where `EventEmitter` already frames the value as the event's type. Anyone
    # porting a script between the two bindings is already renaming
    # `state_flag` -> `stateFlag`; this rename travels with them.
    { method = "Event::kind", reason = "Exposed to Python as the `event_type` string attribute rather than a nested EventKind object. Deliberately `event_type` here and `type` in JS — see the note above." },
    { method = "Event::timestamp", reason = "A std::time::Instant — monotonic and process-local, with no meaningful cross-language representation. Deliberately not exposed." },

    # Input option structs. `click()` / `drag()` route through `click_with` /
    # `drag_with` in every case, with ClickOptions/DragOptions' fields as
    # optional keyword arguments — so the options variants are bound, just not
    # under a second method name. See the ClickOptions / DragOptions entries
    # under [types].
    { method = "InputSim::click_with", reason = "Folded into `click()`'s keyword arguments (button, count, held, anchor); `click()` calls Mouse::click_with unconditionally." },
    { method = "InputSim::drag_with", reason = "Folded into `drag()`'s keyword arguments (button, held, duration); `drag()` calls Mouse::drag_with unconditionally." },
    { method = "InputSim::backend", reason = "Reports which platform input backend is active; diagnostic plumbing, not user API." },
    { method = "InputSim::point_for", reason = "Internal coordinate resolution helper used by the Rust input builders." },
    { method = "InputSim::keyboard", reason = "Sub-API accessor; bindings flatten keyboard methods onto InputSim directly." },
    { method = "InputSim::mouse", reason = "Sub-API accessor; bindings flatten mouse methods onto InputSim directly." },

    # Wait / event-loop idiom differences.
    { method = "Locator::with_timeout", reason = "Rust-only per-locator timeout builder; Python uses per-call timeout parameters plus set_default_timeout()." },
    { method = "Locator::wait_for_state", reason = "Rust generic state-enum wait; Python exposes wait_visible/wait_enabled/... plus predicate-based wait_until." },
    { method = "Subscription::recv_status", reason = "Rust disconnected-vs-timeout polling variant; Python uses predicate-based wait_for." },
    { method = "Subscription::iter", reason = "Python exposes the __iter__/__next__ context-manager idiom instead of a blocking iterator." },
]

# Python members with no core counterpart. Dunder methods (__repr__, __eq__,
# __iter__, ...) are filtered automatically and need no entry.
python_only = [
    # Convenience constructors wrapping the `_with` variants with the
    # singleton provider. The Rust equivalents live on `xa11y::AppExt`.
    { method = "App::by_name", reason = "Binding-level convenience over App::by_name_with; mirrors `xa11y::AppExt::by_name`." },
    { method = "App::by_pid", reason = "Binding-level convenience over App::by_pid_with; mirrors `xa11y::AppExt::by_pid`." },
    { method = "App::foreground", reason = "Binding-level convenience over App::foreground_with; mirrors `xa11y::AppExt::foreground`." },
    { method = "App::list", reason = "Binding-level convenience over App::list_with; mirrors `xa11y::AppExt::list`." },
    { method = "App::find", reason = "Binding-level convenience over App::try_find_with; mirrors `xa11y::AppExt::find`." },

    { method = "Element::subscribe", reason = "Binding convenience: subscribe to events for any element, delegating to provider.subscribe()." },
    { method = "Subscription::close", reason = "Python context-manager idiom; pairs with __enter__ / __exit__ for explicit cleanup." },

    # Event: core's `kind: EventKind` enum is destructured into flat string
    # attributes at the boundary.
    { method = "Event::event_type", reason = "Flattened from EventKind: the variant name as a string (`focus_changed`, `state_changed`, ...)." },
    { method = "Event::state_flag", reason = "Flattened from EventKind::StateChanged payload: which state changed." },
    { method = "Event::state_value", reason = "Flattened from EventKind::StateChanged payload: the new value of that state." },
]

# ── JavaScript ───────────────────────────────────────────────────────────

[js]
rust_only = [
