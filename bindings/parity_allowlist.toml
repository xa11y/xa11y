    { method = "App::find_with", reason = "Binding uses the singleton provider; exposed to JS as `App.find`, a poll loop in index.js." },
    { method = "App::try_find_with", reason = "Fallible-predicate variant of find_with; the JS App.find poll loop propagates predicate errors directly." },
    { method = "App::provider", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "App::data", reason = "Internal plumbing for provider implementors, not user API." },

    { method = "Locator::new", reason = "Internal Rust constructor; bindings build Locators via App.locator() / module-level locator()." },
    { method = "Element::new", reason = "Internal Rust constructor; bindings obtain Elements via Locator / navigation." },
    { method = "Element::data", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "Element::provider", reason = "Internal plumbing for provider implementors, not user API." },
    { method = "Element::handle", reason = "Opaque provider handle; not part of the user-visible API." },
    { method = "Element::states", reason = "JS flattens StateSet into individual getters (enabled, visible, ...) rather than exposing the nested object. The individual booleans ARE required — see [[types.flatten]]." },
    { method = "Subscription::new", reason = "Internal Rust constructor; bindings create Subscriptions via App.subscribe() / Element.subscribe()." },
    { method = "InputSim::new", reason = "Internal Rust constructor; bindings obtain an InputSim via the module-level inputSim()." },

    # Event field naming / representation.
    { method = "Event::kind", reason = "Exposed to JS as the `type` string property rather than a nested EventKind object." },
    { method = "Event::timestamp", reason = "A std::time::Instant — monotonic and process-local, with no meaningful cross-language representation. Deliberately not exposed." },

    # Input primitives not currently bound. These are real gaps, not design
    # decisions: the bindings expose the composite verbs (click, drag) but
    # not the low-level half-press primitives or the options-struct variants.
    { method = "InputSim::down", reason = "GAP: low-level key/button press-without-release is not exposed to JS. Bindings expose only composite verbs (press, click)." },
    { method = "InputSim::up", reason = "GAP: low-level key/button release is not exposed to JS. Bindings expose only composite verbs (press, click)." },
    { method = "InputSim::click_with", reason = "GAP: the ClickOptions variant of click is not exposed to JS; only the plain click() is bound." },
    { method = "InputSim::drag_with", reason = "GAP: the DragOptions variant of drag is not exposed to JS; only the plain drag() is bound." },
    { method = "InputSim::backend", reason = "Reports which platform input backend is active; diagnostic plumbing, not user API." },
    { method = "InputSim::point_for", reason = "Internal coordinate resolution helper used by the Rust input builders." },
    { method = "InputSim::keyboard", reason = "Sub-API accessor; bindings flatten keyboard methods onto InputSim directly." },
    { method = "InputSim::mouse", reason = "Sub-API accessor; bindings flatten mouse methods onto InputSim directly." },

    { method = "Locator::with_timeout", reason = "Rust-only per-locator timeout builder; JS uses per-call timeout options plus setDefaultTimeout()." },
    { method = "Locator::wait_for_state", reason = "Rust generic state-enum wait; JS exposes specific wait* helpers plus predicate-based waitUntil." },
    { method = "Subscription::recv_status", reason = "Rust disconnected-vs-timeout polling variant; JS uses waitFor and the EventEmitter model." },
    { method = "Subscription::recv", reason = "JS exposes an async EventEmitter + start/drain worker pattern instead of blocking recv." },
    { method = "Subscription::try_recv", reason = "JS exposes an async EventEmitter + start/drain worker pattern instead of blocking try_recv." },
    { method = "Subscription::iter", reason = "JS exposes an async EventEmitter + start/drain worker pattern instead of a blocking iterator." },
]

# JS members with no core counterpart. `constructor` is filtered automatically.
js_only = [
    { method = "App::by_name", reason = "Binding-level convenience over App::by_name_with; mirrors `xa11y::AppExt::by_name`." },
    { method = "App::by_pid", reason = "Binding-level convenience over App::by_pid_with; mirrors `xa11y::AppExt::by_pid`." },
    { method = "App::foreground", reason = "Binding-level convenience over App::foreground_with; mirrors `xa11y::AppExt::foreground`." },
    { method = "App::list", reason = "Binding-level convenience over App::list_with; mirrors `xa11y::AppExt::list`." },
    { method = "App::find", reason = "Binding-level convenience over App::try_find_with; implemented as a poll loop in index.js, declared in index.d.ts." },
    { method = "App::wait_for_event", reason = "JS-only convenience: temporary subscription + single-event wait, declared in index.d.ts." },

    { method = "Element::subscribe", reason = "Binding convenience: subscribe to events for any element, delegating to provider.subscribe()." },

    # Event: core's `kind: EventKind` enum is destructured into flat string
    # properties at the boundary.
    { method = "Event::type", reason = "Flattened from EventKind: the variant name as a string (`focusChanged`, `stateChanged`, ...). Named `type` in JS, `event_type` in Python." },
    { method = "Event::state_flag", reason = "Flattened from EventKind::StateChanged payload: which state changed." },
    { method = "Event::state_value", reason = "Flattened from EventKind::StateChanged payload: the new value of that state." },

    # _NativeSubscription worker-pattern plumbing behind the EventEmitter wrapper.
    { method = "Subscription::start", reason = "JS threadsafe-function worker pattern for async event delivery; not user API." },
    { method = "Subscription::drain", reason = "JS threadsafe-function worker pattern for async event delivery; not user API." },
    { method = "Subscription::close", reason = "JS idiom for explicit teardown, on both _NativeSubscription and the EventEmitter wrapper." },
    { method = "Subscription::closed", reason = "JS readonly property on the EventEmitter-based Subscription wrapper." },
    { method = "Subscription::wait_for_event", reason = "JS-only EventEmitter convenience, declared in index.d.ts." },
]
