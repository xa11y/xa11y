# xa11y test coverage matrix
# Each entry lists covered features, [] for none, or unsupported: {reason: "..."}
#
# MAINTENANCE: This file is the authoritative coverage index, and the public
# "How xa11y Is Tested" page (docs/site/src/content/docs/testing.mdx)
# summarizes it — the test-app/platform table and the CI matrix description.
# If you add/remove an app, platform, or feature here, update that page too.
#
# `platforms:` is checked against the `integ` matrix in .github/workflows/ci.yml
# by matrix_check.py: an app must have a cell on every platform it names, or an
# entry under `covered_outside_integ` naming the vehicle that covers it. It used
# to be prose that only looked authoritative, which is how a windows-latest
# Tauri cell that never existed hid the Windows input-simulation gap (#348).

apps:
  accesskit:
    platforms: [linux, macos, windows]
    covered_outside_integ:
      macos: >
        Rust integ suite via ./scripts/run_integ_tests_macos.sh, run locally
        rather than in CI: the suite needs a kTCCServiceAccessibility grant
        against a cargo-hashed binary path, which is fragile on hosted runners.
      windows: >
        Rust integ suite via scripts/run_integ_tests_windows.ps1 in the
        `windows` CI job.
    notes: >
      Core Rust test app (winit + AccessKit). The primary coverage vehicle is the
      Rust integ suite in xa11y/tests/integ/, not the per-app compat matrix.
      JS integ tests also target this app for compat and actions.
      The ubuntu-latest integ cell is the only one: the macOS/Windows cells ran
      no language suites (see declared_suite_skips in tests/harness/launch.py),
      so the Rust integ jobs carry those platforms instead.

  qt:
    platforms: [linux, macos, windows]

  gtk:
    platforms: [linux]

  cocoa:
    platforms: [macos]

  tauri:
    platforms: [linux, macos, windows]
    notes: >
      Primary vehicle for input_sim and screenshot coverage (one-per-platform strategy).
      Uses a dedicated event-log page that captures synthesised pointer and keyboard
      events, enabling end-to-end assertions rather than smoke tests.
      The windows-latest cell landed in #348 and is the only cell that reaches
      WebView2; it is also the only end-to-end cover for xa11y-windows'
      SendInput backend, since tauri is the sole app carrying input_sim. The
      wire-level `Windows (SendInput)` job exercises that backend without a
      webview, so a WebView2 quirk here stays distinguishable from a
      SendInput bug.
      The page is laid out in columns so it fits the window without
      scrolling, and it has to stay that way. A page taller than its window
      makes every test depend on the scroll position the previous test left:
      focusing a control below the fold scrolls the top of the page out of
      view, Chromium marks those nodes UIA IsOffscreen=true, and xa11y then
      correctly refuses to act on them. Linux and macOS never showed it
      because WebKit reports scrolled-out nodes as visible regardless. The
      harness prints the content element's state between suites, which is
      what pinned it (bounds went from y=148 to y=-534 across the Python
      suite).

  electron:
    platforms: [linux]
    notes: >
      Chromium-based. JS integ tests also exercise AccessibilityNotEnabledError detection
      (app launched without --force-renderer-accessibility).

  egui:
    platforms: [linux, macos, windows]
    notes: >
      Native Rust immediate-mode GUI via `eframe`. AccessKit drives the
      cross-platform a11y tree (AT-SPI2 on Linux, AX on macOS, UIA on
      Windows). Outside the Cargo workspace because the eframe dependency
      tree (winit, glow, glutin, image, …) noticeably slows workspace-wide
      builds; built explicitly by the `integ`/`test-egui` jobs.

  winforms:
    platforms: [windows]
    notes: >
      The only Microsoft UI framework in the matrix. Every other Windows cell
      reaches UIA through a third-party bridge (Qt via qt, AccessKit via
      egui), so the WinForms provider — and in particular the
      DataGridView, whose cells are ControlType.DataItem + the TableItem
      pattern — is what exercises the row-vs-cell disambiguation in
      xa11y-windows against a framework grid. Built with `dotnet build`
      (the .NET SDK is preinstalled on windows-latest runners).

  wpf:
    platforms: [windows]
    notes: >
      The second Microsoft UI framework, and the only app in the matrix whose
      grid cells are ControlType.Custom + the TableItem pattern
      (DataGridCellItemAutomationPeer) — the branch of map_uia_role added in
      #323, which was unit-tested only until this app landed. Its rows report
      DataItem and the grid reports DataGrid, so the same tree covers the
      row-vs-cell disambiguation from a second framework. WPF also implements
      RangeValue on Slider/ProgressBar and publishes UIA_IsDialogPropertyId
      via AutomationProperties.IsDialog, both of which WinForms cannot express.
      Built with `dotnet build` (the .NET SDK is preinstalled on
      windows-latest runners).

features:
  compat:
    description: "a11y API compatibility: tree structure, find, roles, widget discovery"
    per_app: true

  actions:
    description: "press, focus, toggle, type, expand/collapse"
    per_app: true

  events:
    description: "event subscription and state change detection"
    per_app: true

  errors:
    description: "error paths: invalid selectors, selector misses, wait timeouts, unsupported actions"
    per_app: true

  input_sim:
    description: "input simulation: click, double-click, right-click, drag, key press, chord, type, scroll"
    per_app: false
    tested_on: [tauri, electron]
    notes: >
      Tests platform input APIs, not a11y compatibility. Covered once per
      platform: Linux and macOS through the tauri cells, Windows through the
      windows-latest tauri cell added in #348.
      Python: Tauri app (end-to-end with event log). JS: Tauri + Electron apps
      (smoke tests; see the app gate in tests/suites/js/03_input_sim.test.js).
      Linux and Windows additionally have a wire-level job that asserts the
      events the backend emits with no app in the loop, so a renderer quirk is
      distinguishable from a backend bug: `Linux Wayland (uinput)` reads back
      through libevdev, `Windows (SendInput)` through WH_KEYBOARD_LL /
      WH_MOUSE_LL hooks (xa11y-windows/tests/send_input_wire.rs). macOS has none,
      so the tauri cell is its only cover — see the
      macos_input_sim_wire_level gap.

  screenshot:
    description: "window and element screenshots; PNG save"
    per_app: false
    tested_on: [tauri, electron]
    notes: >
      Tests platform screenshot APIs. Covered once per platform. On Windows
      that cover came from rust_core alone until the windows-latest tauri cell
      landed in #348; both now run there.
      Python: Tauri app. JS: Tauri + Electron apps. Rust: AccessKit app
      (rust_core).

# rust_core is the xa11y/tests/integ/ suite — separate from per-app compat suites.
rust_core:
  app: accesskit
  features: [compat, actions, events, screenshot]
  note: >
    Fast-path core validation. All tests are #[ignore] and run via `cargo xtask test-integ`.
    Platform-split event tests: events_linux.rs, events_macos.rs, events_windows.rs.

# coverage[app][language] = list of features covered, or [] for none.
coverage:
  accesskit:
    # Python compat/actions run against the AccessKit app on Linux only (the
    # harness gates this on sys.platform). The events module also runs but its
    # assertions are xfail-guarded. On macOS/Windows the Rust integ suite stays
    # the canonical AccessKit coverage. See note below.
    python: [compat, actions, events, errors]
    # JS input_sim/screenshot are gated to Tauri + Electron in the test files
    # (one-per-renderer-family strategy); they self-skip for AccessKit.
    js: [compat, actions]
    cli: [compat, actions]  # CLI is Rust — natural to test against the Rust test app

  qt:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

  gtk:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

  cocoa:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

  tauri:
    python: [compat, actions, events, errors, input_sim, screenshot]
    js: [compat, actions, input_sim, screenshot]
    cli: [compat, actions, input_sim, screenshot]

  electron:
    python: [compat, actions, errors]
    js: [compat, actions, input_sim, screenshot]
    cli: [compat, actions]

  egui:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

  winforms:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

  wpf:
    python: [compat, actions, events, errors]
    js: [compat, actions]
    cli: [compat, actions]

gaps:
  - id: accesskit_python_suite_non_linux
    description: >
      The Python compat/actions suite now runs against the AccessKit app on
      Linux (tests/harness/launch.py wires it up there; see APP_CONFIGS
      "accesskit" in tests/suites/python/conftest.py). It is intentionally NOT
      run on macOS or Windows: AccessKit's AX/UIA bridges are already covered
      canonically by the Rust integ suite in xa11y/tests/integ/, and the
      Linux AT-SPI bridge (accesskit_unix) is the one with behaviour the
      Python suite uniquely guards (the "click"-not-"toggle" action naming).
    severity: low
    workaround: "Rust integ suite (cargo xtask test-integ) covers compat, actions, events, screenshot on macOS/Windows"
    affects:
      apps: [accesskit]
      language: python

  - id: macos_input_sim_wire_level
    description: >
      macOS is the one input backend with no wire-level job. Linux has
      `Linux Wayland (uinput)`, which reads events back through libevdev, and
      Windows has `Windows (SendInput)`, which reads them back through
      WH_KEYBOARD_LL / WH_MOUSE_LL hooks; both assert the emitted codes with
      no app in the loop, so a renderer quirk cannot be mistaken for a backend
      bug. The macos-latest tauri cell is the only cover for CGEvent, and
      several of its assertions are xfail(strict=False) because CGEvent drag
      and scroll do not reliably reach WKWebView as DOM events — so an
      end-to-end failure there is genuinely ambiguous between the two layers.
      A CGEventTap readback would be the equivalent; whether one can run
      under CI's TCC grant is unexplored.
    severity: low
    workaround: "macos-latest x tauri integ cell covers the CGEvent path end-to-end"
    affects:
      apps: [tauri]
      features: [input_sim]

  - id: js_input_sim_per_app
    description: >
      JS input_sim and screenshot tests run only against Tauri and Electron
      (the app gate at the top of tests/suites/js/03_input_sim.test.js and
      04_screenshot.test.js). Not per-app by design — tests platform
      input/screenshot APIs, not a11y compat.
    severity: low
    workaround: "Python covers input_sim+screenshot on Tauri; JS covers on Tauri+Electron"
    affects:
      apps: [qt, gtk, cocoa]
      language: js
      features: [input_sim, screenshot]

# Resolved gaps (kept here briefly for provenance):
#   windows_input_sim — input simulation had no automated coverage of any kind
#   on Windows: input_sim is carried by tauri and electron, and neither had a
#   windows-latest cell, while xa11y-windows/src/input.rs had no unit tests
#   either. Closed on two fronts in #348: the `- { os: windows-latest, app:
#   tauri }` integ cell drives SendInput end-to-end through WebView2, and the
#   `Windows (SendInput)` job runs xa11y-windows/tests/send_input_wire.rs,
#   which reads the emitted events back through low-level hooks. The reason
#   the gap stayed invisible — an unvalidated `platforms:` key — is closed by
#   the Execution check in matrix_check.py.
#
#   uia_custom_table_cells_unit_only — the Custom + TableItem cell branch of
#   map_uia_role (#323) had no app producing it: WinForms' DataGridView
#   reports DataItem cells. test-apps/wpf's DataGrid reports
#   ControlType.Custom + TableItem (DataGridCellItemAutomationPeer), so the
#   branch is now covered end-to-end by the windows-latest x wpf integ cell
#   (table_cell_values + table_selected_cell_value in APP_CONFIGS["wpf"]).
#
#   gtk_events — the GTK test app now exposes the Dynamic widget group
#   (Status label + Submit / Add Item / Remove Item buttons in
#   test-apps/gtk/app.py), so the shared Python event suite runs against GTK
#   instead of skipping on a missing Submit button. Behavioural event
#   assertions remain xfail(strict=False) where AT-SPI2 emission is known to
#   be unreliable, matching the other toolkits.
#
#   accesskit_python_compat_on_linux — the Python compat/actions suite now
#   runs against the AccessKit app on Linux via tests/harness/launch.py, with
#   an APP_CONFIGS "accesskit" entry mapping the Submit/Cancel schema. This
#   exercises accesskit_unix's "click"-not-"toggle" action naming and the
#   toggle()-via-press fallback in xa11y-linux/src/atspi.rs end-to-end through
#   the bindings (test_checkbox_toggle_changes_state / _via_element /
#   test_checkbox_press_via_element). The remaining (intentional) non-coverage
#   on macOS/Windows is tracked as accesskit_python_suite_non_linux above.

