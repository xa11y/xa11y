[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-xa11y"
# strands-xa11y versions independently of xa11y itself. It tracks the Strands
# SDK's tool surface, which moves on its own schedule, so cargo-release's
# shared-version scheme (which moves every crate in lockstep) deliberately
# does not reach it. See RELEASING.md.
#
# This was `dynamic = ["version"]` via hatch-vcs while the package lived in its
# own repository, where the only `v*` tags were its own. In this repository
# those tags belong to xa11y, so hatch-vcs would stamp the wheel with xa11y's
# version. The tag scheme here is `strands-xa11y-v*`, and this line is the
# source of truth that .github/scripts/bump_python_package.py rewrites.
version = "0.1.1"
description = "Drive native macOS, Windows, and Linux desktop apps from a Strands agent through the accessibility tree."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xa11y contributors" }]
keywords = [
    "strands",
    "strands-agents",
    "agents",
    "ai",
    "tool",
    "desktop-automation",
    "accessibility",
    "computer-use",
    "xa11y",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "strands-agents>=1.0.0",
    "pydantic>=2.0.0",
    # Pre-1.0: the accessibility surface is still moving, so the ceiling is a
    # real bound rather than open-ended. It spans two minors deliberately —
    # xa11y 0.14.0 is breaking for Rust consumers (a required `Provider`
    # method, a changed `ScreenshotProvider` signature, `#[non_exhaustive]`)
    # but purely additive on the Python surface this package reads, and a
    # ceiling that excluded it would make `pip install strands-xa11y` refuse to
    # co-install the xa11y it is built against. `check_real_surface.py` holds
    # this line against the version actually built from the tree.
    "xa11y>=0.13.0,<0.15.0",
]

[project.optional-dependencies]
# close_app terminates processes by name; xa11y itself never launches or kills them.
process = ["psutil>=5.8.0,<8.0.0"]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "psutil>=5.8.0,<8.0.0",
    "hatch",
]

[project.urls]
Homepage = "https://github.com/xa11y/xa11y"
Documentation = "https://xa11y.dev/guides/strands/"
Repository = "https://github.com/xa11y/xa11y"
Issues = "https://github.com/xa11y/xa11y/issues"
"Upstream library" = "https://xa11y.dev/"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_xa11y"]

# Explicit, because this package no longer sits at the root of its own
# repository: without it hatchling would sweep in every sibling directory of
# the monorepo that is not gitignored.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "RELEASING.md", "pyproject.toml"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
# The fake backend makes every branch reachable without a desktop, so anything less than
# full cover means a path nothing exercises. CI runs this, not bare `test`.
cov = "pytest --cov=strands_xa11y --cov-report=term-missing --cov-fail-under=100 {args}"
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# -ra so a skip or xfail in CI is visible in the summary rather than hidden in a dot.
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["strands_xa11y"]
