[package]
name = "xa11y"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform accessibility client library — unified API for reading and interacting with accessibility trees"
readme = "README.md"

[features]
# The `xa11y` binary: argument parsing, the human-readable output formats, and
# the MCP stdio server. On by default so `cargo install xa11y` keeps producing
# the CLI, and so both language bindings (which forward their own entry points
# into `cli::run`) get it without extra configuration. A library consumer that
# only wants the API can drop the two protocol modules with
# `default-features = false`.
default = ["cli"]
cli = []
testing = []
strict-roles = ["xa11y-core/strict-roles"]
# Re-exports the shared mock Provider from xa11y-core. Used by language
# bindings' test builds; not needed in production.
test-support = ["xa11y-core/test-support"]

[dependencies]
xa11y-core = { workspace = true }
# `LegendEntry` / `Omission` / `OmissionReason` derive `Serialize` so the CLI's
# `--legend json`, the MCP result and the bindings all render one shape rather
# than each hand-building a JSON object that can drift from the others.
serde = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
xa11y-macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
xa11y-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
xa11y-linux = { workspace = true }

[[bin]]
name = "xa11y"
path = "src/bin/xa11y.rs"
required-features = ["cli"]

[dependencies.serde_json]
workspace = true

[dev-dependencies]
# `test-support` pulls in xa11y-core's shared mock Provider for this crate's
# own unit tests: `ShellSurface` has no public constructor (its provider handle
# is private), so `cli::select_shell_surface` is only testable against surfaces
# the mock vends.
xa11y = { path = ".", features = ["testing", "test-support"] }
serde_json = { workspace = true }
