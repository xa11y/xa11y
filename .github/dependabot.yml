version: 2

# One grouped pull request per ecosystem, per week, all landing Monday 06:00 UTC.
#
# Dependabot cannot open a single pull request spanning more than one
# package-ecosystem — a cargo bump and an npm bump are resolved by different
# tooling against different lockfiles, so they can never share a branch. Four
# entries is therefore the floor. Within each entry, `directories` collapses
# every lockfile that ecosystem owns into one update run, and a catch-all
# `groups` pattern collapses every dependency in that run into one PR.
updates:
  # ── Rust ───────────────────────────────────────────────────────────
  # The Tauri and egui test apps are excluded from the workspace, so they
  # carry their own committed lockfiles. Listing them here keeps Dependabot
  # proposing (and CI testing) their updates instead of CI silently
  # re-resolving — and breaking — on an unpinned transitive release.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/test-apps/tauri"
      - "/test-apps/egui"
      # The binding crates sit outside the workspace and carry their own
      # lockfiles — and those lockfiles are what build the published PyPI
      # wheel and npm binary. Without these entries they drifted five zbus
      # minors behind root (5.14.0 vs 5.19.0), so the shipped Linux AT-SPI
      # transport was not the one CI tested.
      - "/xa11y-python"
      - "/xa11y-js"
      - "/xa11y/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      cargo:
        patterns:
          - "*"

  # ── GitHub Actions ─────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      github-actions:
        patterns:
          - "*"

  # ── npm ────────────────────────────────────────────────────────────
  # The JS bindings and the docs site each carry their own committed lockfile.
  # The Electron test app does not (test-apps/electron/.gitignore ignores
  # package-lock.json), so Dependabot can only widen its package.json ranges
  # there — nothing pins its transitive tree.
  - package-ecosystem: "npm"
    directories:
      - "/xa11y-js"
      - "/docs/site"
      - "/test-apps/electron"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      npm:
        patterns:
          - "*"

  # ── Python ─────────────────────────────────────────────────────────
  # Shared integration-test requirements and the Python bindings package.
  - package-ecosystem: "pip"
    directories:
      - "/tests"
      - "/xa11y-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      pip:
        patterns:
          - "*"
