name: UWP spike (throwaway)

on:
  push:
    branches: [test/497-uwp-test-app]
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Probe runner
        shell: pwsh
        continue-on-error: true
        run: |
          [System.Environment]::OSVersion | Format-List
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber,WindowsInstallationType | Format-List
          whoami /all | Select-String -Pattern 'Mandatory Label|Administrators'
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' | Select-Object EnableLUA,ConsentPromptBehaviorAdmin,FilterAdministratorToken | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -ErrorAction SilentlyContinue | Format-List
          Test-Path C:\Windows\System32\ApplicationFrameHost.exe
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vswhere -latest -products * -format text | Select-String 'displayName|installationVersion'
          'Universal workload: ' + (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath)
          'UWP managed component: ' + (& $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.Support -property installationPath)
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Select-Object Name
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Recurse -Filter plmdebug.exe -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object FullName
          Get-AppxPackage | Select-Object Name, SignatureKind | Format-Table -AutoSize
          Get-Process | Where-Object { $_.SessionId -ne 0 } | Select-Object -First 1 SessionId

      - name: Build
        shell: pwsh
        run: test-apps/uwp/build.ps1

      - name: Install
        shell: pwsh
        run: test-apps/uwp/install.ps1

      - name: Launch and look
        shell: pwsh
        run: |
          $pfn = (Get-AppxPackage -Name xa11y.UwpTestApp).PackageFamilyName
          Start-Process explorer.exe "shell:AppsFolder\$pfn!App"
          Start-Sleep 15
          Add-Type @'
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public static class W {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr p, EnumProc f, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            static string Desc(IntPtr h) {
              var c = new StringBuilder(256); GetClassName(h, c, 256);
              var t = new StringBuilder(256); GetWindowText(h, t, 256);
              uint pid; GetWindowThreadProcessId(h, out pid);
              string pn = "?"; try { pn = System.Diagnostics.Process.GetProcessById((int)pid).ProcessName; } catch {}
              return String.Format("0x{0:x} class={1} title='{2}' pid={3} ({4}) visible={5}", h.ToInt64(), c, t, pid, pn, IsWindowVisible(h));
            }
            public static List<string> Dump() {
              var r = new List<string>();
              EnumWindows((h, l) => {
                var c = new StringBuilder(256); GetClassName(h, c, 256);
                if (c.ToString() == "ApplicationFrameWindow" || c.ToString() == "Windows.UI.Core.CoreWindow") {
                  r.Add(Desc(h));
                  EnumChildWindows(h, (ch, l2) => { r.Add("    child " + Desc(ch)); return true; }, IntPtr.Zero);
                }
                return true; }, IntPtr.Zero);
              return r;
            }
          }
          '@
          [W]::Dump()
          Get-Process | Where-Object { $_.ProcessName -match 'xa11y|ApplicationFrameHost' } | Format-Table Id,ProcessName,MainWindowTitle,SessionId
          Add-Type -AssemblyName UIAutomationClient
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          foreach ($e in $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
            "{0} | {1} | pid={2}" -f $e.Current.Name, $e.Current.ClassName, $e.Current.ProcessId
          }
          $frame = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'xa11y UWP Test')))
          if ($frame) {
            foreach ($e in $frame.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              "  {0} | {1} | {2} | pid={3}" -f $e.Current.ControlType.ProgrammaticName, $e.Current.Name, $e.Current.ClassName, $e.Current.ProcessId
            }
          } else { 'NO FRAME FOUND' }

      - name: PLMDebug probe
        shell: pwsh
        continue-on-error: true
        run: |
          $plm = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter plmdebug.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $plm) { 'plmdebug not found'; exit 0 }
          $pfn = (Get-AppxPackage -Name xa11y.UwpTestApp).PackageFullName
          & $plm /query $pfn
          & $plm /enableDebug $pfn
          & $plm /suspend $pfn
          Start-Sleep 5
          & $plm /query $pfn
          & $plm /resume $pfn
          Start-Sleep 3
          & $plm /query $pfn
          & $plm /disableDebug $pfn
